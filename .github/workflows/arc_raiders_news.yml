name: ARC Raiders news to Stoat

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        with:
          path: seen.txt
          key: arc-raiders-seen-v2

      - name: Fetch Steam news and post to Stoat
        env:
          STOAT_WEBHOOK: ${{ secrets.STOAT_WEBHOOK_ARC }}
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import pathlib
          import re
          import sys
          import urllib.error
          import urllib.request
          hook = os.environ.get("STOAT_WEBHOOK", "").strip()
          if not hook.startswith("http"):
              print("STOAT_WEBHOOK secret missing or invalid")
              sys.exit(1)
          api = (
              "https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/"
              "?appid=1808500&count=20&maxlength=300&format=json&l=english"
          )
          req = urllib.request.Request(api, headers={"User-Agent": "ArcRaidersStoatBot"})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
                  print(f"steam news HTTP {response.status}")
          except urllib.error.HTTPError as error:
              print(f"steam news failed: HTTP {error.code}")
              print(error.read()[:400])
              sys.exit(1)
          def is_english(title: str) -> bool:
              letters = re.findall(r"[A-Za-zА-Яа-яЁё]", title)
              if not letters:
                  return True
              cyrillic = sum(1 for ch in letters if "А" <= ch <= "я" or ch in "Ёё")
              return cyrillic / len(letters) < 0.3
          items = data.get("appnews", {}).get("newsitems", [])
          print(f"found {len(items)} steam news items")
          items = [item for item in items if is_english(item.get("title") or "")]
          print(f"english items: {len(items)}")
          for item in items[:3]:
              print(" ", item.get("title"), item.get("gid"))
          state = pathlib.Path("seen.txt")
          seen = set(state.read_text().splitlines()) if state.exists() else set()
          first_run = not seen
          batch = items[:1] if first_run else items[:8]
          posted = 0
          new_lines = list(seen)
          for item in reversed(batch):
              gid = str(item.get("gid") or "")
              title = html.unescape(item.get("title") or "ARC Raiders update")
              url = (
                  else "https://store.steampowered.com/news/app/1808500"
              )
              raw_desc = item.get("contents") or ""
              desc = re.sub(r"<[^>]+>", "", html.unescape(raw_desc))
              desc = re.sub(r"\s+", " ", desc).strip()
              if len(desc) > 280:
                  desc = desc[:277] + "..."
              if not gid or gid in seen:
                  continue
              text = f"**{title}**\n{desc}\n{url}" if desc else f"**{title}**\n{url}"
              body = json.dumps({
                  "content": text,
                  "masquerade": {
                      "name": "ARC Raiders News",
                      "avatar": "https://cdn.cloudflare.steamstatic.com/steam/apps/1808500/capsule_231x87.jpg"
                  }
              }).encode()
              try:
                  hook_req = urllib.request.Request(
                      hook,
                      data=body,
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(hook_req, timeout=30) as resp:
                      print(f"posted {title!r} -> HTTP {resp.status}")
              except urllib.error.HTTPError as error:
                  print(f"stoat webhook failed: HTTP {error.code}")
                  print(error.read()[:400])
                  sys.exit(1)
              new_lines.append(gid)
              posted += 1
          if first_run:
              for item in items:
                  gid = str(item.get("gid") or "")
                  if gid and gid not in new_lines:
                      new_lines.append(gid)
          state.write_text("\n".join(new_lines[-300:]) + ("\n" if new_lines else ""))
          print(f"done, posted {posted}")
          PY
