name: Active Matter news to Stoat

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        with:
          path: seen.txt
          key: active-matter-seen-${{ github.run_id }}
          restore-keys: |
            active-matter-seen-

      - name: Fetch Steam news and post to Stoat
        env:
          STOAT_WEBHOOK: ${{ secrets.STOAT_WEBHOOK_ACTIVEMATTER }}
        run: |
          python3 - <<'PY'
          # ============================================================
          # CUSTOMIZE THIS GAME
          # App ID: steamdb.info  |  Secret name must match GitHub Actions
          # ============================================================
          APP_ID = 2887580
          GAME_NAME = "Active Matter"
          BOT_NAME = "Active Matter News"
          AVATAR = "https://pbs.twimg.com/profile_images/1917566324613562368/uuVJ3tmY.jpg"
          SECRET_ENV = "STOAT_WEBHOOK"
          NEWS_HUB = "https://store.steampowered.com/news/app/2887580"
          CACHE_LABEL = "active-matter"
          # ============================================================

          import html, json, os, pathlib, re, sys, urllib.error, urllib.request
          hook = os.environ.get(SECRET_ENV, "").strip()
          if not hook.startswith("http"):
              print(SECRET_ENV, "secret missing or invalid")
              sys.exit(1)
          api = (
              "https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/"
              "?appid=%s&count=20&maxlength=300&format=json&l=english" % APP_ID
          )
          req = urllib.request.Request(api, headers={"User-Agent": CACHE_LABEL + "-stoat-bot"})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
                  print("steam news HTTP", response.status)
          except urllib.error.HTTPError as error:
              print("steam news failed: HTTP", error.code)
              print(error.read()[:400])
              sys.exit(1)
          def is_english(title):
              letters = re.findall(r"[A-Za-zА-Яа-яЁё]", title)
              if not letters:
                  return True
              cyr = sum(1 for ch in letters if "А" <= ch <= "я" or ch in "Ёё")
              return cyr / len(letters) < 0.3
          items = data.get("appnews", {}).get("newsitems", [])
          print("found", len(items), "steam news items")
          items = [item for item in items if is_english(item.get("title") or "")]
          print("english items:", len(items))
          state = pathlib.Path("seen.txt")
          seen = set(state.read_text().splitlines()) if state.exists() else set()
          print("seen count:", len(seen))
          first_run = not seen
          batch = items[:1] if first_run else items[:8]
          posted = 0
          new_lines = list(seen)
          for item in reversed(batch):
              gid = str(item.get("gid") or "")
              title = html.unescape(item.get("title") or (GAME_NAME + " update"))
              raw_desc = item.get("contents") or ""
              desc = re.sub(r"<[^>]+>", "", html.unescape(raw_desc))
              desc = re.sub(r"\s+", " ", desc).strip()
              if len(desc) > 280:
                  desc = desc[:277] + "..."
              if not gid or gid in seen:
                  print("skip", gid or title)
                  continue
              text = "**" + title + "**\n" + ((desc + "\n") if desc else "") + NEWS_HUB
              body = json.dumps({
                  "content": text,
                  "masquerade": {"name": BOT_NAME, "avatar": AVATAR}
              }).encode()
              try:
                  hook_req = urllib.request.Request(
                      hook, data=body,
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(hook_req, timeout=30) as resp:
                      print("posted", title, "-> HTTP", resp.status)
              except urllib.error.HTTPError as error:
                  print("stoat webhook failed: HTTP", error.code)
                  print(error.read()[:400])
                  sys.exit(1)
              new_lines.append(gid)
              posted += 1
          if first_run:
              for item in items:
                  gid = str(item.get("gid") or "")
                  if gid and gid not in new_lines:
                      new_lines.append(gid)
          state.write_text("\n".join(new_lines[-300:]) + ("\n" if new_lines else ""))
          print("done, posted", posted, "seen now", len(new_lines))
          PY
