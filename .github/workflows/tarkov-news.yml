name: Tarkov news to Stoat
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feed and post new items
        env:
          STOAT_WEBHOOK: ${{ secrets.STOAT_WEBHOOK }}
          FEED_URL: https://rss.app/feeds/v1.1/BpLwQ2ApYdd24xup.json
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, pathlib, hashlib
          feed_url = os.environ["FEED_URL"]
          hook = os.environ["STOAT_WEBHOOK"]
          state = pathlib.Path("seen.txt")
          seen = set(state.read_text().splitlines()) if state.exists() else set()
          with urllib.request.urlopen(feed_url, timeout=30) as r:
              data = json.load(r)
          items = data.get("items") or data.get("entries") or []
          new_lines = list(seen)
          for item in reversed(items[:8]):
              url = item.get("url") or item.get("link") or ""
              title = item.get("title") or "Tarkov update"
              key = url or title
              if not key or key in seen:
                  continue
              body = json.dumps({"content": f"**{title}**\n{url}"}).encode()
              req = urllib.request.Request(
                  hook, data=body,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              urllib.request.urlopen(req, timeout=30)
              new_lines.append(key)
          state.write_text("\n".join(new_lines[-200:]) + ("\n" if new_lines else ""))
          PY
      - name: Save seen items
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: update seen feed items
        continue-on-error: true
