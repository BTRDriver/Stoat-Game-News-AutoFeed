name: Tarkov news to Stoat
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        with:
          path: seen.txt
          key: tarkov-seen

      - name: Scrape official news and post
        env:
          STOAT_WEBHOOK: ${{ secrets.STOAT_WEBHOOK }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error, pathlib, html as htmllib

          hook = os.environ.get("STOAT_WEBHOOK", "").strip()
          if not hook.startswith("http"):
              print("STOAT_WEBHOOK secret missing or invalid")
              sys.exit(1)

          news_url = "https://www.escapefromtarkov.com/news"
          req = urllib.request.Request(
              news_url,
              headers={"User-Agent": "Mozilla/5.0 TarkovStoatBot"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  page = r.read().decode("utf-8", "replace")
                  print(f"news page HTTP {r.status}, {len(page)} bytes")
          except urllib.error.HTTPError as e:
              print(f"news page failed: HTTP {e.code}")
              sys.exit(1)

          # official articles look like /news/id/408
          found = []
          seen_ids = set()
          for m in re.finditer(
              r'href="(/news/id/(\d+))"[\s\S]{0,400}?<[^>]*>([^<]{3,200})<',
              page,
              re.I,
          ):
              path, nid, title = m.group(1), m.group(2), htmllib.unescape(m.group(3)).strip()
              title = re.sub(r"\s+", " ", title)
              if nid in seen_ids:
                  continue
              if title.lower() in {"read more", "more", "news"}:
                  continue
              seen_ids.add(nid)
              found.append((nid, "https://www.escapefromtarkov.com" + path, title))

          if not found:
              # fallback: any /news/id/N link
              for nid in re.findall(r"/news/id/(\d+)", page):
                  if nid not in seen_ids:
                      seen_ids.add(nid)
                      found.append((nid, f"https://www.escapefromtarkov.com/news/id/{nid}", f"Tarkov news #{nid}"))

          print(f"found {len(found)} articles")
          for nid, url, title in found[:5]:
              print(f"  {nid}: {title} {url}")

          state = pathlib.Path("seen.txt")
          seen = set(state.read_text().splitlines()) if state.exists() else set()
          posted = 0
          # first run: mark current items seen, post only the newest one so you don't dump the whole archive
          first_run = not seen
          to_consider = found[:1] if first_run else found[:8]

          new_lines = list(seen)
          for nid, url, title in reversed(to_consider):
              if nid in seen:
                  continue
              body = json.dumps({"content": f"**{title}**\n{url}"}).encode()
              try:
                  hook_req = urllib.request.Request(
                      hook, data=body,
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(hook_req, timeout=30) as resp:
                      print(f"posted {title!r} -> HTTP {resp.status}")
              except urllib.error.HTTPError as e:
                  print(f"stoat webhook failed: HTTP {e.code}")
                  print(e.read()[:400])
                  sys.exit(1)
              new_lines.append(nid)
              posted += 1

          if first_run:
              for nid, _, _ in found:
                  if nid not in new_lines:
                      new_lines.append(nid)

          state.write_text("\n".join(new_lines[-300:]) + ("\n" if new_lines else ""))
          print(f"done, posted {posted}")
          PY
